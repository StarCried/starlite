[package]
name = "inox2d-web-wasm"
description = "Narrow wasm-bindgen bridge for rendering Inox2D puppets in WebGL2"
version.workspace = true
edition.workspace = true
license-file = "../../LICENSE"
repository.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.wasm-pack.profile.release]
# Rust stable emits standard bulk-memory and saturating-conversion operations.
# Binaryen must be told to preserve every feature used by the input module.
wasm-opt = ["-Oz", "--all-features"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
glam = "0.29.3"
glow = "0.14.2"
inox2d = { git = "https://github.com/Inochi2D/inox2d.git", rev = "df8413e6b0c525dbb880b4dca2bdf0a5d4b9aaba" }
inox2d-opengl = { git = "https://github.com/Inochi2D/inox2d.git", rev = "df8413e6b0c525dbb880b4dca2bdf0a5d4b9aaba" }
js-sys = "0.3.103"
wasm-bindgen = "0.2.126"

[dependencies.web-sys]
version = "0.3.103"
features = [
  "HtmlCanvasElement",
  "WebGl2RenderingContext",
]
