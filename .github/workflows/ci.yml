name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      docs-only: ${{ steps.scope.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: scope
        run: node tools/ci-scope.mjs

  docs:
    needs: scope
    if: needs.scope.outputs.docs-only == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/check-docs.mjs
      - run: git diff --check

  validate:
    needs: scope
    if: needs.scope.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy,rustfmt
      - run: bash tools/install-ci-wasm-tools.sh
      - uses: actions/cache@v4
        with:
          path: ~/.cache/starlite/official-sdk
          key: official-sdk-${{ runner.os }}-${{ hashFiles('tools/official-sdk/pin.json', 'tools/official-sdk/**', 'tools/build-official-sdk.mjs') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run validate
      - run: npm run check:docs
      - run: npm run test:browser
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: browser-runtimes
          path: |
            packages/core/dist
            packages/inochi2d/dist
            packages/vrm/dist
            packages/hexo/dist
          if-no-files-found: error
          retention-days: 1

  windows-browser:
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        channel: [chrome, msedge]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: browser-runtimes
          path: packages
      - run: npm run test:browser
        env:
          STARLITE_BROWSER_CHANNEL: ${{ matrix.channel }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-${{ matrix.channel }}-traces
          path: examples/vanilla/test-results
          retention-days: 7

  result:
    if: always()
    needs: [scope, docs, validate, windows-browser]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the selected gates to pass
        env:
          SCOPE: ${{ needs.scope.result }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs-only }}
          DOCS: ${{ needs.docs.result }}
          VALIDATE: ${{ needs.validate.result }}
          WINDOWS: ${{ needs.windows-browser.result }}
        run: |
          test "$SCOPE" = success
          if [ "$DOCS_ONLY" = true ]; then
            test "$DOCS" = success
          else
            test "$VALIDATE" = success
            test "$WINDOWS" = success
          fi
