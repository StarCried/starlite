name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:dependency-audit
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2-v1
      - name: Install the pinned RustSec scanner
        shell: bash
        run: |
          if [[ ! -x "$RUNNER_TEMP/cargo-audit/bin/cargo-audit" ]]; then
            cargo install cargo-audit --version 0.22.2 --locked --root "$RUNNER_TEMP/cargo-audit"
          fi
          "$RUNNER_TEMP/cargo-audit/bin/cargo-audit" --version
      - name: Scan the complete JavaScript and Rust lockfiles
        env:
          CARGO_AUDIT_BIN: ${{ runner.temp }}/cargo-audit/bin/cargo-audit
        run: npm run check:dependencies
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: target/dependency-audit
          if-no-files-found: warn
          retention-days: 14
