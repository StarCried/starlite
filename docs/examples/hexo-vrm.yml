# 合并到博客 _config.yml；模型放在 source/ 之外。
# publication 确认涵盖模型、贴图和内嵌动作的博客托管许可。
starlite:
  enable: true
  backend: vrm
  model: ./models/avatar.vrm
  publication:
    confirm: true
    allowRedistribution: true
  render:
    fps: 30
    maxDevicePixelRatio: 1
  mobile:
    show: false
    breakpoint: 768
  interactions:
    pointer: true
    passThrough: true
    drag: false
  # 不需要动作也能显示气泡；按需删改。
  dialogue:
    click:
      lines: ["你好，欢迎来坐坐。", "慢慢看，我在这里。"]
      durationMs: 7200

