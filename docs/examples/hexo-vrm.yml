# 0.1.0-alpha.3 起，无需任何 starlite 配置即可显示微光。
# 以下仅演示按需覆盖；日常使用不必复制整个示例。
# 将一个 starlite 段合并到博客 _config.yml，不要重复添加同名段。
starlite:
  render:
    fps: 30
  # 临时检查实际 FPS 与帧耗时；正常阅读建议关闭，默认 false。
  performance:
    show: false
  position:
    right: 48
    bottom: 32
    zIndex: 20
  dialogue:
    click:
      # 共用句库替换默认逐动作句子，保留默认点击动作池。
      lines: ["你好，欢迎来坐坐。", "慢慢看，我在这里。"]

# 只改一个动作的句子：用下列 dialogue 替换上面的 dialogue；其他句子保留。
# dialogue:
#   click:
#     linesByAnimation:
#       HighFive: ["击掌！", "做得好。"]
#   enter: false  # 关闭首次入场及其气泡
#   idle: false   # 关闭偶发动作及其气泡，基础 Idle 继续

# 关闭默认点击动作和气泡：在 starlite 下添加 interactions: {click: false}。
# 若已显式配置 dialogue.click，也将其设为 false。
# 停用所有看板娘功能：只保留 starlite: {enable: false}。

# 页面专属句子（本地候选，尚未发布到 npm）：写在文章 Markdown 的 front matter。
# starlite:
#   - "欢迎来到这一页。"
#   - "慢慢看，我在这里。"
#
# 需要更多选项时，同一位置改用对象形式：
# starlite:
#   lines: ["见到你很开心。", "要击个掌吗？"]
#   animation: HighFive  # 必须是模型已有动作
#   triggers: [click, idle]
#   mode: replace
#   order: sequential
#
# 全站页面默认值：在博客 _config.yml 现有 starlite 段中添加 pageDialogue。
# pageDialogue:
#   animation: HighFive
#   triggers: [click, idle]
#   mode: replace
#   order: sequential
# 不指定 animation 时沿用入场动作；点击和偶发共用顺序，切换页面重新开始。
# 默认覆盖对应全站句库；mode: merge 可将本页句子放在全站候选前。

# 替换自己的模型时，用以下配置替换整个 starlite 段。
# 模型放在博客根目录 models/ 下，source/ 之外；自动选择 VRM 后端。
# 不继承微光专属动作、句库、镜头和显示参数。
# publication 确认涵盖模型、贴图和内嵌动作的博客托管许可。
# starlite:
#   model: ./models/avatar.vrm
#   publication:
#     confirm: true
#     allowRedistribution: true
#   dialogue:
#     click:
#       lines: ["你好。"]
#       durationMs: 7200

# 自定义模型确有 Wave/Nod 动作时，可将 click 替换为：
# click:
#   animations: [Wave, Nod]
#   linesByAnimation:
#     Wave: ["你好呀。", "看到你了！"]
#     Nod: ["我在听。", "嗯，慢慢来。"]
#   durationMs: 7200
